name: 功能建议
description: 提出一个可以独立实现的小改进
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望的游戏行为
      description: 描述玩家会看到什么、怎样操作，以及怎样才算完成。
    validations:
      required: true
