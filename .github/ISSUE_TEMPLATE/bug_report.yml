name: 问题反馈
description: 报告规则、操作或页面显示问题
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开游戏开始，说明怎样触发问题；规则问题请附棋盘和移动方向。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      placeholder: 例如 iPhone / iOS 版本 / Safari；或 Windows / Edge 版本
    validations:
      required: true
